# ---------- 규칙 (방법이 붙은 가설) ----------
[[rule]]
id = "R_weights"
method = "1주 기간(5거래일 / 7일) 계산기의 오를 확률 p로 대상마다 목표 비중 = 1/3 × clamp((p − 0.40) ÷ 0.20, 0, 1), 나머지는 현금. 확률이 '모름'이면 지금 비중을 그대로 둔다. 목표 금액과 지금(체결 안 된 주문 포함) 금액의 차이가 계좌의 2%보다 작으면 거래하지 않는다"
reason = "셋을 똑같이 나눠 사 두기(기준선)와 같은 상한(1/3)에서 출발해, 계산기가 비관적일 때만 덜 들고 낙관적일 때 다 채운다. 그래서 기준선과의 차이가 곧 계산기의 '때 고르기' 성적이다. 2% 문턱은 작은 흔들림마다 수수료를 내지 않으려는 것"
status = "hypothesis"
version = 1
serves = "G_predict"
check = ["account_vs_equal"]
note = "2026-10-20 1단계에서 정함(재생 계좌용). 숫자 0.40·0.20·1/3·2%는 기록에서 맞춘 값이 아니라 미리 정한 모양이다. 진짜 계좌의 비중은 2단계에서 손 예측이 정한다(docs/design.md)"

