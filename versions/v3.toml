# stock-rader 논리집 — Claude가 혼자 하는 가상 투자로 논리 조각화를 시험한다 (PROVISO 지식 양식)
# 검사: python -m market.logic validate | check | audit   (PROVISO 코어를 불러 쓴다: market/logic.py)
# 쌓는 방식은 PROVISO-Nesy domains/agent_usage/CLAUDE.md를 따른다: 모든 주장은 성적 붙은 가설, 세운 뒤의 날들로만 시험,
# 틀리면 조건을 더해 쪼갠다(새 버전), 이전 버전은 retired + replaced_by로 남긴다.
# 계산 조각의 모양(무엇에·어떻게·언제·방향·이유)은 손으로 적고(claims 칸), 숫자(effect의 range)는 `python -m market.fit --write`가
# 2026-06-30까지의 시세로 기계적으로 맞춘다. 손으로 숫자를 넣거나 넓히면 audit 오류.
# 조각 id·문장·이유에는 대상(상품·코인) 이름을 쓰지 않는다 — 다른 대상·분야에서 다시 쓴다. effect의 asset·horizon 칸은
# '어느 대상·기간의 숫자인가'만 가리킨다(성적과 숫자는 대상별로 따로 쌓는다).
# 조사 조각(2단계, 2026-10-21): 시세로 계산하지 않고 매일 조사 결과로 메인이 대 보는 조각(read_by = "조사", id Q_*).
# 효과 숫자가 없고 방향 주장(claims)만 있다. 주장이 걸리는 대상은 이름 대신 성질(scope: market/config.py TRAITS)로 적는다.
# 손 예측이 이 조각들을 쓰고, 성적은 2026-10-21 뒤의 판단으로만 쌓는다(checks.research_direction). 상한은 계산 조각과 따로(checks.MAX_RESEARCH_PIECES).

[domain]
id = "market"
name = "가상 투자 — 시세로 계산하는 조각 (stock-rader)"
# 효과가 작용하는 것: up_odds = 오를 확률의 승산(오를 확률 ÷ 내릴 확률), move = 기간 동안 움직임 크기(수익률 절댓값, %)
quantities = ["up_odds", "move"]
situation_values = ["예", "아니오", "모름"]
max_ratio = 2  # 효과 범위와 계산한 범위의 폭 상한(상한/하한). 넓혀서 맞추지 않는다

# ---------- 목표 (사용자 의도: CLAUDE.md "사용자 의도", 2026-10-20) ----------
[[goal]]
id = "G_test"
text = "논리 조각화를 시험한다: 틀리면 원인을 쪼갠 논리가 쪼개기 전 버전과 기준선보다 앞으로 더 잘 맞히는지 본다 (돈을 버는 것이 목표가 아니다)"

[[goal]]
id = "G_predict"
text = "대상마다 다음 거래일·1주·4주 뒤를 이유와 함께 예측하고 시장 결과로 채점받는다 ('모든 에이전트 작업이 시험')"
parent = "G_test"

[[goal]]
id = "G_timing"
text = "'지금이 어떤 시기냐'(추세, 겁먹은 시기 등)가 중요하다는 것도 조각으로 잡히는지 본다"
parent = "G_test"

[[goal]]
id = "G_research"
text = "조사 범위도 논리집에 쌓는다: 어디를 봤더니 좋았다, 어디는 정보가 없었다 (2단계)"
parent = "G_test"

[[goal]]
id = "G_record"
text = "기록을 꼼꼼히 남긴다: 덧붙이기만 하고, 결과 전에 말했다는 증거를 남긴다"
parent = "G_test"

[[goal]]
id = "G_report"
text = "매일 투자하는 사람이 쓰듯 무엇을 왜 샀고 얼마를 벌고 잃었는지 보고서를 쓴다"
parent = "G_test"

# ---------- 상태: 가격으로 대 보는 조각의 조건 (계산: market/pieces.py, '봉' = 그 대상의 일봉 하나) ----------
[[state]]
id = "S_trend_20"
text = "최근 20봉 수익률이 양수다"
known_before = true
serves = "G_timing"

[[state]]
id = "S_trend_60"
text = "최근 60봉 수익률이 양수다"
known_before = true
serves = "G_timing"

[[state]]
id = "S_above_ma200"
text = "종가가 최근 200봉 평균보다 위다"
known_before = true
serves = "G_timing"

[[state]]
id = "S_drop_5"
text = "최근 5봉에 평소 한 주 움직임(60봉 하루 변동성 × √5)보다 크게 내렸다"
known_before = true
serves = "G_timing"

[[state]]
id = "S_vol_high"
text = "최근 20봉 하루 변동성이 최근 250봉 하루 변동성보다 크다 (흔들림이 평소보다 큰 시기)"
known_before = true
serves = "G_timing"

[[state]]
id = "S_deep_drawdown"
text = "최근 250봉 고점보다 평소 한 달 움직임의 두 배(250봉 하루 변동성 × √20 × 2)보다 깊이 빠져 있다"
known_before = true
serves = "G_timing"

[[state]]
id = "S_big_move"
text = "마지막 봉의 움직임이 평소 하루 움직임(60봉 하루 변동성)의 두 배를 넘었다"
known_before = true
serves = "G_timing"

# ---------- 상태: 조사로 대 보는 조건 (2단계, 2026-10-21. 매일 조사 → 메인이 예/아니오/일부/모름으로 대 본다) ----------
# ask = 조사 질문(조사 에이전트에게 그대로 준다), angle = 조사 각도. 판단 시각 전에 나온 정보로만 대 본다(known_before).
[[state]]
id = "S_q_rate_up"
text = "기준이 되는 중앙은행이 금리를 올리는 중이거나, 다음 결정에서 올릴 것으로 시장이 보는 쪽이 우세하다"
known_before = true
serves = "G_timing"
read_by = "조사"
angle = "금리·환율·정책"
ask = "미국 중앙은행(연준)과 한국은행은 지금 금리를 올리는 중인가, 내리는 중인가, 멈춘 상태인가? 다음 결정 날짜와 시장이 보는 확률(예: 금리 선물로 본 확률)은? 두 곳이 다르면 둘 다 적는다"

[[state]]
id = "S_q_rate_shift_up"
text = "기준이 되는 중앙은행이 금리를 올리는 쪽이고, 최근 1주 사이 시장이 보는 다음 결정이 더 올리는 쪽으로 뚜렷하게 바뀌었다 (금리 선물·예측시장의 인상 확률이 10%p 넘게 올랐거나, 그 사이 결정·발표문이 시장 예상보다 올리는 쪽이었다)"
known_before = true
serves = "G_timing"
read_by = "조사"
angle = "금리·환율·정책"
ask = "최근 1주 사이 시장이 보는 연준·한국은행 다음 결정의 인상 확률이 어떻게 바뀌었나? 1주 전 값과 지금 값(같은 출처: 금리 선물·예측시장·설문), 그 사이 결정·발표문이 시장 예상보다 올리는 쪽이었나(결정 직후 2년물 금리 움직임 등)"
note = "2026-10-30 더함: Q_rate_up을 쪼개며 더한 조건. 근거 문헌(F_lit_policy_stock)이 주가 반응을 '예상 밖 결정'에서 찾았으므로, 올리는 흐름이라는 상태가 아니라 기대가 올리는 쪽으로 바뀌는지를 본다"

[[state]]
id = "S_q_home_currency_weak"
text = "계좌 통화가 기준 외화에 대해 최근 한 달 사이 뚜렷하게 약해지는 중이다 (환율이 오르는 중)"
known_before = true
serves = "G_timing"
read_by = "조사"
angle = "금리·환율·정책"
ask = "달러-원 환율이 최근 한 달(약 20거래일) 사이 얼마나 움직였나? 원화가 약해지는 중인가(환율이 오르는 중인가)? 판단 시각 직전 값과 한 달 전 값, 출처"

[[state]]
id = "S_q_risk_off"
text = "시장이 겁먹은 상태다: 앞으로의 흔들림 예상(공포 지수)이 평소보다 높거나 최근 크게 올랐고, 안전한 쪽으로 돈이 몰린다"
known_before = true
serves = "G_timing"
read_by = "조사"
angle = "미국 시장"
ask = "미국 주식 공포 지수(VIX)의 지금 값과 최근 한 달 범위·1년 평균은? 국내 공포 지수(VKOSPI)와 코인 공포·탐욕 지수도 있으면 적는다. 안전 자산(국채·금·달러)으로 돈이 몰리는 기사가 있나?"

[[state]]
id = "S_q_event_soon"
text = "다음 거래일(또는 다음 하루) 안에 큰 일정(금리 결정, 물가 발표, 고용 발표)이 있다"
known_before = true
serves = "G_timing"
read_by = "조사"
angle = "금리·환율·정책"
ask = "오늘 판단 시각부터 다음 거래일 장 마감까지 미국·한국의 금리 결정, 소비자물가(CPI) 발표, 고용 발표가 있나? 날짜와 한국 시간, 공식 일정표 링크"

[[state]]
id = "S_q_bigcap_earnings"
text = "다음 거래일(또는 다음 하루) 안에 지수의 큰 몫을 차지하는 종목(지수 비중 상위 몇 종목)의 실적 발표가 있거나, 판단 직전 하루 안에 나왔다"
known_before = true
serves = "G_timing"
read_by = "조사"
angle = "한국 시장"
ask = "오늘 판단 시각부터 다음 거래일 장 마감까지, 또는 판단 직전 하루 안에 한국 지수(KOSPI200)와 미국 지수(S&P500)의 비중 상위 종목 실적 발표가 있나? 회사, 발표 날짜와 한국 시간, 지수 비중(대략), 출처"

# ---------- 사실: 근거 문헌 (2026-10-20 웹 검색으로 실재 확인. 본문은 옮기지 않고 요지만) ----------
# kind = 출처 종류(연구 / 통념 / 실험 결과 / 이 저장소의 기록), strength = 근거 강도(낮음 / 보통 / 높음): 이 분야(지수·코인의 시계열)에 바로 맞는 정도

[[state]]
id = "S_q_exchange_hack"
text = "판단 직전 사흘 안에 큰 디지털 자산 거래소(거래량 상위)가 해킹이나 출금 중단을 겪었다는 보도가 있었고, 피해(또는 의심 이동) 규모가 10억 달러를 넘는다"
known_before = true
serves = "G_timing"
read_by = "조사"
angle = "코인"
ask = "판단 직전 사흘 안에 큰 디지털 자산 거래소의 해킹·출금 중단 보도가 있나? 거래소 이름, 보도 날짜·시각, 피해(의심 이동) 규모, 출금이 지금도 멈춰 있나, 동결된 금액"
note = "2026-10-30 더함: 10-29 큰 거래소 해킹 의혹(의심 지갑 약 58억 달러, 출금 일부 중단)이 나왔고 조각 목록에 이 일을 대 볼 곳이 없었다"

[[state]]
id = "S_q_earnings_beat"
text = "이 종목의 회사가 판단 직전 열흘 안에 낸 실적(잠정 실적 포함)이 시장 예상(증권사 전망 평균)보다 뚜렷하게 좋았다"
known_before = true
serves = "G_timing"
read_by = "조사"
angle = "한국 시장"
per_asset = true
ask = "이 회사가 판단 직전 열흘 안에 실적(잠정 실적 포함)을 냈나? 냈다면 영업이익이 증권사 전망 평균(컨센서스)보다 몇 % 높거나 낮았나? 발표 날짜·시각, 전망 평균의 출처, 공시나 기사 링크"
[[fact]]
