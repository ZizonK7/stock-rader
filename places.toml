# 볼 곳(조사 출처) 노드 — 조사 범위도 논리집에 넣는다 (사용자 제안 2026-10-20, docs/design.md "조사 범위도 논리집에")
# 성적은 손으로 적지 않는다: 기록(records/research.jsonl, hand_reading, reading_check)에서 코드가 계산한다
#   python -m market.research places
# 칸: id(P_*), name(사람용 이름), url(들어가는 곳), angle(주로 쓰는 조사 각도), covers(주로 답하는 상태 id),
#     official(공식 기관이 직접 내는 곳인가 — H_place_official이 쓴다), added(목록에 넣은 날), note
# 새 곳을 시도해서 쓸 만했으면 여기에 더한다(조사 기록에는 new = true로 남는다). 지우지 않는다 — 안 쓰게 됐으면 note에 적는다.
# 2026-10-21 첫 목록은 세운 사람이 알던 곳이다(써 본 성적 없음). 여기만 보지 않도록 매일 각도마다 새 곳을 하나 이상 시도한다.

