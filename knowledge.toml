# stock-rader 논리집 — Claude가 혼자 하는 가상 투자로 논리 조각화를 시험한다 (PROVISO 지식 양식)
# 검사: python -m market.logic validate | check | audit   (PROVISO 코어를 불러 쓴다: market/logic.py)
# 쌓는 방식은 PROVISO-Nesy domains/agent_usage/CLAUDE.md를 따른다: 모든 주장은 성적 붙은 가설, 세운 뒤의 날들로만 시험,
# 틀리면 조건을 더해 쪼갠다(새 버전), 이전 버전은 retired + replaced_by로 남긴다.
# 계산 조각의 모양(무엇에·어떻게·언제·방향·이유)은 손으로 적고(claims 칸), 숫자(effect의 range)는 `python -m market.fit --write`가
# 2026-06-30까지의 시세로 기계적으로 맞춘다. 손으로 숫자를 넣거나 넓히면 audit 오류.
# 조각 id·문장·이유에는 대상(상품·코인) 이름을 쓰지 않는다 — 다른 대상·분야에서 다시 쓴다. effect의 asset·horizon 칸은
# '어느 대상·기간의 숫자인가'만 가리킨다(성적과 숫자는 대상별로 따로 쌓는다).

[domain]
id = "market"
name = "가상 투자 — 시세로 계산하는 조각 (stock-rader)"
# 효과가 작용하는 것: up_odds = 오를 확률의 승산(오를 확률 ÷ 내릴 확률), move = 기간 동안 움직임 크기(수익률 절댓값, %)
quantities = ["up_odds", "move"]
situation_values = ["예", "아니오", "모름"]
max_ratio = 2  # 효과 범위와 계산한 범위의 폭 상한(상한/하한). 넓혀서 맞추지 않는다

# ---------- 목표 (사용자 의도: CLAUDE.md "사용자 의도", 2026-10-20) ----------
[[goal]]
id = "G_test"
text = "논리 조각화를 시험한다: 틀리면 원인을 쪼갠 논리가 쪼개기 전 버전과 기준선보다 앞으로 더 잘 맞히는지 본다 (돈을 버는 것이 목표가 아니다)"

[[goal]]
id = "G_predict"
text = "대상마다 다음 거래일·1주·4주 뒤를 이유와 함께 예측하고 시장 결과로 채점받는다 ('모든 에이전트 작업이 시험')"
parent = "G_test"

[[goal]]
id = "G_timing"
text = "'지금이 어떤 시기냐'(추세, 겁먹은 시기 등)가 중요하다는 것도 조각으로 잡히는지 본다"
parent = "G_test"

[[goal]]
id = "G_research"
text = "조사 범위도 논리집에 쌓는다: 어디를 봤더니 좋았다, 어디는 정보가 없었다 (2단계)"
parent = "G_test"

[[goal]]
id = "G_record"
text = "기록을 꼼꼼히 남긴다: 덧붙이기만 하고, 결과 전에 말했다는 증거를 남긴다"
parent = "G_test"

[[goal]]
id = "G_report"
text = "매일 투자하는 사람이 쓰듯 무엇을 왜 샀고 얼마를 벌고 잃었는지 보고서를 쓴다"
parent = "G_test"

# ---------- 상태: 가격으로 대 보는 조각의 조건 (계산: market/pieces.py, '봉' = 그 대상의 일봉 하나) ----------
[[state]]
id = "S_trend_20"
text = "최근 20봉 수익률이 양수다"
known_before = true
serves = "G_timing"

[[state]]
id = "S_trend_60"
text = "최근 60봉 수익률이 양수다"
known_before = true
serves = "G_timing"

[[state]]
id = "S_above_ma200"
text = "종가가 최근 200봉 평균보다 위다"
known_before = true
serves = "G_timing"

[[state]]
id = "S_drop_5"
text = "최근 5봉에 평소 한 주 움직임(60봉 하루 변동성 × √5)보다 크게 내렸다"
known_before = true
serves = "G_timing"

[[state]]
id = "S_vol_high"
text = "최근 20봉 하루 변동성이 최근 250봉 하루 변동성보다 크다 (흔들림이 평소보다 큰 시기)"
known_before = true
serves = "G_timing"

[[state]]
id = "S_deep_drawdown"
text = "최근 250봉 고점보다 평소 한 달 움직임의 두 배(250봉 하루 변동성 × √20 × 2)보다 깊이 빠져 있다"
known_before = true
serves = "G_timing"

[[state]]
id = "S_big_move"
text = "마지막 봉의 움직임이 평소 하루 움직임(60봉 하루 변동성)의 두 배를 넘었다"
known_before = true
serves = "G_timing"

